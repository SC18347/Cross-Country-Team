<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Bot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #060a10;
  --grid-line: rgba(61, 220, 255, 0.05);
  --panel: #0c141d;
  --panel-border: rgba(61, 220, 255, 0.28);
  --cyan: #3ddcff;
  --cyan-soft: rgba(61, 220, 255, 0.15);
  --amber: #ffb454;
  --text: #d7eef5;
  --muted: #6f93a3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 34px 34px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.page-header { text-align: center; padding: 40px 20px 14px; }
.status-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.12em;
  color: var(--cyan);
  border: 1px solid var(--panel-border);
  padding: 5px 14px; border-radius: 999px;
  background: var(--cyan-soft);
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .status-dot, .bubble.typing { animation: none !important; } }
.page-header h1 {
  margin: 16px 0 6px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700; font-size: 1.5rem; letter-spacing: 0.05em;
  text-shadow: 0 0 18px var(--cyan-soft);
}
.hud-sub { font-size: 0.82rem; color: var(--muted); }

/* ===== CHAT ===== */
.chat-wrap { max-width: 460px; margin: 0 auto; padding: 10px 16px 40px; }

.chat-panel {
  position: relative;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 18px; padding: 16px;
}
.chat-panel::before, .chat-panel::after {
  content: ""; position: absolute; width: 16px; height: 16px;
  border: 2px solid var(--cyan); opacity: 0.55;
}
.chat-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.chat-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

#chat-log {
  display: flex; flex-direction: column; gap: 10px;
  max-height: 55vh; overflow-y: auto; padding: 2px 2px 4px;
}
.bubble {
  max-width: 84%; padding: 12px 15px; border-radius: 14px;
  font-size: 0.98rem; line-height: 1.45; white-space: pre-line;
}
.bubble.bot {
  align-self: flex-start;
  background: #0f1822; border: 1px solid var(--panel-border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.bubble.user {
  align-self: flex-end;
  background: var(--amber); color: #221200;
  border-bottom-right-radius: 4px;
  font-weight: 600;
}
.bubble.typing { animation: pulse 1s ease-in-out infinite; }

#chat-options {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
}
.chat-option {
  width: auto; padding: 10px 16px;
  background: var(--panel); border: 1px solid var(--cyan); color: var(--cyan);
  border-radius: 999px; font-family: 'Rajdhani', sans-serif;
  font-weight: 600; font-size: 0.85rem; cursor: pointer;
}
.chat-option:active { background: var(--cyan-soft); }

.site-footer {
  text-align: center; padding: 18px 20px 34px;
  font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
}
.site-footer a { color: var(--muted); text-decoration: none; }
.site-footer a:hover { color: var(--cyan); }
</style>
</head>
<body>

  <header class="page-header">
    <div class="status-tag"><span class="status-dot"></span>HEALTH BOT ONLINE</div>
    <h1>HEALTH BOT</h1>
    <div class="hud-sub">General tips only — see your coach or a doctor for real injuries.</div>
  </header>

  <div class="chat-wrap">
    <div class="chat-panel">
      <div id="chat-log"></div>
      <div id="chat-options"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p><a href="index.html">← Back to Schedule</a></p>
  </footer>

<script>
/* =========================================
   HEALTH BOT — CONVERSATION DATA
   Add more topics by adding more entries here.
   Each entry needs:
     bot: what Health Bot says
     options: buttons shown after — each needs
       a label (button text) and next (which
       entry name to jump to when tapped)
   A "\n\n" inside a bot message starts a new
   paragraph.
   ========================================= */
const CONVO = {
  start: {
    bot: "Hey, I'm Health Bot 🤖 — stretches, at-home strength, recovery, and fueling tips for runners. What do you need?",
    options: [
      { label: "🦵 Stretches", next: "stretches" },
      { label: "💪 At-Home Strength", next: "strength" },
      { label: "🧊 Recovery", next: "recovery" },
      { label: "🍎 Fueling & Nutrition", next: "nutrition" },
      { label: "⚠️ Something hurts", next: "hurts" }
    ]
  },

  stretches: {
    bot: "Which area's tight?",
    options: [
      { label: "Calves", next: "s-calves" },
      { label: "Hamstrings", next: "s-hamstrings" },
      { label: "Quads & Hip Flexors", next: "s-quads" },
      { label: "IT Band & Glutes", next: "s-itband" },
      { label: "🏠 Main Menu", next: "start" }
    ]
  },
  "s-calves": {
    bot: "Wall calf stretch: face a wall, step one foot back with the knee straight and heel flat on the ground, lean into the wall until you feel it in the upper calf. For the lower calf, do the same but bend the back knee slightly. Hold 30 seconds, twice per leg.",
    options: [ { label: "⬅ More Stretches", next: "stretches" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "s-hamstrings": {
    bot: "Prop your heel on a low step or curb with the leg straight, hinge forward from your hips (keep your back flat, don't round it) until you feel it behind the thigh. Hold 30 seconds, twice per leg. Ease into it — hamstrings respond better to a gentle, sustained pull than a hard bounce.",
    options: [ { label: "⬅ More Stretches", next: "stretches" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "s-quads": {
    bot: "Quads: standing on one leg, grab your other ankle behind you and gently pull your heel toward your glutes, keeping your knees close together. For hip flexors: kneel on one knee in a lunge position, tuck your pelvis slightly, and push your hips forward until you feel a stretch at the front of the hip. 30 seconds each, twice per side.",
    options: [ { label: "⬅ More Stretches", next: "stretches" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "s-itband": {
    bot: "Honest tip: the IT band itself barely stretches, so cross-legged 'IT band stretches' don't do much on their own. What actually helps is loosening the glutes it connects to — try a figure-4 (lying on your back, cross one ankle over the opposite knee, pull that thigh toward your chest) and add glute strength work.",
    options: [ { label: "💪 See Glute Strength", next: "st-glutes" }, { label: "🏠 Main Menu", next: "start" } ]
  },

  strength: {
    bot: "These are all bodyweight — no equipment needed. Pick one:",
    options: [
      { label: "Core", next: "st-core" },
      { label: "Glutes & Hips", next: "st-glutes" },
      { label: "Single-Leg Stability", next: "st-single" },
      { label: "🏠 Main Menu", next: "start" }
    ]
  },
  "st-core": {
    bot: "Plank: 30–45 seconds, 3 rounds. Side plank: 20–30 seconds each side, 2–3 rounds. Dead bug: lie on your back, arms up, knees bent at 90°, slowly lower opposite arm and leg toward the floor without your back arching, then switch — 10 each side, 2–3 rounds. A strong core keeps your form from breaking down late in a race.",
    options: [ { label: "⬅ More Strength", next: "strength" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "st-glutes": {
    bot: "Glute bridge: lie on your back, knees bent, feet flat, squeeze your glutes to lift your hips — 15–20 reps, 2–3 rounds. Clamshells: lie on your side, knees bent, feet together, open your top knee like a clamshell — 15 each side, 2–3 rounds. Weak hips are behind a lot of common runner aches, so this pays off.",
    options: [ { label: "⬅ More Strength", next: "strength" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "st-single": {
    bot: "Single-leg balance: stand on one foot 30 seconds each side — close your eyes once that's easy. Single-leg reach: balance on one leg, hinge forward and reach your hand toward the floor, then stand back up — 8–10 each side. Running is just a series of single-leg landings, so this protects your knees and ankles.",
    options: [ { label: "⬅ More Strength", next: "strength" }, { label: "🏠 Main Menu", next: "start" } ]
  },

  recovery: {
    bot: "What are you looking for?",
    options: [
      { label: "Foam Rolling & Ice/Heat", next: "r-rolling" },
      { label: "Sleep & Rest Days", next: "r-sleep" },
      { label: "🏠 Main Menu", next: "start" }
    ]
  },
  "r-rolling": {
    bot: "Foam roll calves, quads, and hamstrings for 30–60 seconds each, rolling slowly and pausing briefly on tender spots — skip rolling directly on joints or bone. Ice is best for fresh soreness or swelling in the first day or two. Heat is better for loosening a muscle that's just tight, or before stretching.",
    options: [ { label: "⬅ More Recovery", next: "recovery" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "r-sleep": {
    bot: "This one's underrated: teen athletes genuinely need more sleep than adults — aim for 8–10 hours. Your body adapts and repairs itself during sleep and rest days, not during the workout itself. Skipping rest days doesn't make you tougher, it just raises injury risk — an easy walk or light spin is a fine way to stay active on an off day without adding stress.",
    options: [ { label: "⬅ More Recovery", next: "recovery" }, { label: "🏠 Main Menu", next: "start" } ]
  },

  nutrition: {
    bot: "Fueling right helps you perform and recover — this isn't about restricting, it's about eating enough of the right things. What do you want to know?",
    options: [
      { label: "Before a Run", next: "n-before" },
      { label: "After a Run", next: "n-after" },
      { label: "Everyday Eating", next: "n-everyday" },
      { label: "Hydration", next: "n-hydration" },
      { label: "🏠 Main Menu", next: "start" }
    ]
  },
  "n-before": {
    bot: "1–3 hours before running, go for easy-to-digest carbs — a banana, toast with honey, oatmeal. Heavy, greasy, or high-fiber food right before a hard effort can sit poorly and cause stomach trouble mid-run, so save those for other times of day.",
    options: [ { label: "⬅ More Nutrition", next: "nutrition" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "n-after": {
    bot: "Try to eat within 30–60 minutes of finishing — carbs plus some protein refill your energy stores and kickstart muscle repair. Chocolate milk is a genuinely well-studied classic for this, or a sandwich, or yogurt with fruit.",
    options: [ { label: "⬅ More Nutrition", next: "nutrition" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "n-everyday": {
    bot: "Distance runners need real fuel — under-eating hurts performance and recovery more than almost anything else. Build meals around whole grains, fruits, and vegetables for steady energy, protein at each meal for repair, and don't be afraid of carbs — they're your main fuel source, not something to avoid.",
    options: [ { label: "⬅ More Nutrition", next: "nutrition" }, { label: "🏠 Main Menu", next: "start" } ]
  },
  "n-hydration": {
    bot: "Drink water throughout the whole day, not just right before you run. On hot days or longer runs, add electrolytes too. A simple check: pale yellow is well-hydrated; if it's dark, drink more.",
    options: [ { label: "⬅ More Nutrition", next: "nutrition" }, { label: "🏠 Main Menu", next: "start" } ]
  },

  hurts: {
    bot: "Normal soreness after a hard effort is dull, shows up on both sides, peaks a day or two later, and eases up once you're warmed up — rest, easy movement, and the recovery tips here usually sort that out.\n\nSharp pain, pain only on one side, pain that gets worse as you run, swelling, or anything sticking around more than a few days is different — that's a sign to back off, tell your coach, and see an athletic trainer or doctor. I can point you to stretches and recovery basics, but I'm not a substitute for someone who can actually examine it.",
    options: [ { label: "🏠 Main Menu", next: "start" } ]
  }
};

/* =========================================
   CHAT ENGINE — you shouldn't need to touch
   anything below this line.
   ========================================= */
let currentNode = "start";
let history = [];

function renderLog() {
  const log = document.getElementById("chat-log");
  log.innerHTML = "";
  history.forEach(h => {
    const b = document.createElement("div");
    b.className = "bubble " + h.from;
    b.textContent = h.text;
    log.appendChild(b);
  });
  log.scrollTop = log.scrollHeight;
}

function renderOptions() {
  const opts = document.getElementById("chat-options");
  opts.innerHTML = "";
  const node = CONVO[currentNode];
  (node.options || []).forEach(o => {
    const btn = document.createElement("button");
    btn.className = "chat-option";
    btn.textContent = o.label;
    btn.addEventListener("click", () => selectOption(o.label, o.next));
    opts.appendChild(btn);
  });
}

function showTyping() {
  const log = document.getElementById("chat-log");
  const b = document.createElement("div");
  b.className = "bubble bot typing";
  b.textContent = "···";
  log.appendChild(b);
  log.scrollTop = log.scrollHeight;
}

function showBotMessage(nodeId) {
  currentNode = nodeId;
  history.push({ from: "bot", text: CONVO[nodeId].bot });
  renderLog();
  renderOptions();
}

function selectOption(label, nextId) {
  history.push({ from: "user", text: label });
  renderLog();
  document.getElementById("chat-options").innerHTML = "";
  showTyping();
  setTimeout(() => showBotMessage(nextId), 600);
}

showBotMessage("start");
</script>
</body>
</html>
