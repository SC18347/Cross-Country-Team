<style>
:root {
  --bg: #060a10;
  --grid-line: rgba(61, 220, 255, 0.05);
  --panel: #0c141d;
  --panel-border: rgba(61, 220, 255, 0.28);
  --cyan: #3ddcff;
  --cyan-soft: rgba(61, 220, 255, 0.15);
  --amber: #ffb454;
  --text: #d7eef5;

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),

.nav-menu { position: fixed; top: 16px; left: 16px; z-index: 210; }
.nav-toggle {

  color: var(--cyan); border-radius: 999px;

  display: none;

.nav-dropdown.open { display: flex; flex-direction: column; gap: 2px; }
.nav-dropdown a {
  display: block; padding: 10px 12px; border-radius: 8px;

.page-header { flex: 0 0 auto; text-align: center; padding: 18px 90px 10px; }
.status-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.12em;
  color: var(--cyan);
  border: 1px solid var(--panel-border);
  padding: 5px 14px; border-radius: 999px;
  background: var(--cyan-soft);

.status-dot {

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .status-dot, .bubble.typing { animation: none !important; }

.hud-sub { font-size: 0.76rem; color: var(--muted); }

#chat-log {

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  margin: 0 auto;

.bubble.user {

<script>
(function () {
  const toggle = document.getElementById("nav-toggle");
  const dropdown = document.getElementById("nav-dropdown");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.toggle("open");
    toggle.textContent = isOpen ? "✕" : "☰";
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target) && e.target !== toggle) {
      dropdown.classList.remove("open");
      toggle.textContent = "☰";
      toggle.setAttribute("aria-expanded", "false");
    }
  });
})();

/* =========================================
   KNOWLEDGE BASE
   Each topic has a list of keywords/phrases
   people might actually type, and an answer.
   Add a new topic anytime by copying the
   pattern — more keywords = better matching.
   ========================================= */

const TOPICS = [
  // ----- stretches -----
  { keywords: ["calf", "calves", "calf tight", "tight calf", "calf stretch"],
    answer: "Wall calf stretch: face a wall, step one foot back with the knee straight and heel flat on the ground, lean into the wall until you feel it in the upper calf. For the lower calf, do the same but bend the back knee slightly. Hold 30 seconds, twice per leg." },
  { keywords: ["hamstring", "hamstrings", "back of my leg", "back of thigh", "tight hamstring"],
    answer: "Prop your heel on a low step or curb with the leg straight, hinge forward from your hips (keep your back flat, don't round it) until you feel it behind the thigh. Hold 30 seconds, twice per leg. Ease into it — hamstrings respond better to a gentle, sustained pull than a hard bounce." },
  { keywords: ["quad", "quads", "hip flexor", "front of thigh", "front of hip", "hip tight", "tight hip", "hips tight"],
    answer: "Quads: standing on one leg, grab your other ankle behind you and gently pull your heel toward your glutes, keeping your knees close together. For hip flexors: kneel on one knee in a lunge position, tuck your pelvis slightly, and push your hips forward until you feel a stretch at the front of the hip. 30 seconds each, twice per side." },
  { keywords: ["it band", "itband", "outer knee", "outer thigh stretch"],
    answer: "Honest tip: the IT band itself barely stretches, so cross-legged 'IT band stretches' don't do much on their own. What actually helps is loosening the glutes it connects to — try a figure-4 (lying on your back, cross one ankle over the opposite knee, pull that thigh toward your chest) and build glute strength work (ask me about glute strength)." },
  { keywords: ["ankle stretch", "ankle mobility", "stiff ankle", "ankle flexibility"],
    answer: "Ankle circles: lift your foot off the ground and slowly circle it 10 times each direction, both feet. Alphabet trace: write the letters of the alphabet in the air with your big toe — sounds silly, works great for mobility. A calf stretch also helps ankle flexibility since they're connected (ask me about calf stretches)." },
  { keywords: ["hip stretch", "piriformis", "hip rotator", "tight glutes"],
    answer: "Figure-4 stretch: lying on your back, cross one ankle over the opposite knee, then pull that thigh toward your chest until you feel it in the glute/hip area. Hold 30 seconds each side. This targets the piriformis and hip rotators, which get tight from running and can contribute to IT band and lower back issues if ignored." },
  { keywords: ["back pain", "lower back", "back stretch", "back hurts", "back tight"],
    answer: "Child's pose: kneel and sit back on your heels, reach your arms forward and lower your chest toward the ground, hold 30-45 seconds. Knee-to-chest: lying on your back, pull one knee toward your chest, hold 20 seconds, switch sides. A lot of runner back tightness actually comes from a weak core and tight hip flexors, so core work (ask me about core) helps prevent it long-term, not just stretching after it's already tight." },

  // ----- strength -----
  { keywords: ["core", "abs", "plank", "core strength", "core workout"],
    answer: "Plank: 30–45 seconds, 3 rounds. Side plank: 20–30 seconds each side, 2–3 rounds. Dead bug: lie on your back, arms up, knees bent at 90°, slowly lower opposite arm and leg toward the floor without your back arching, then switch — 10 each side, 2–3 rounds. A strong core keeps your form from breaking down late in a race." },
  { keywords: ["glute strength", "glute exercise", "hip strength", "weak hips", "clamshell", "bridge"],
    answer: "Glute bridge: lie on your back, knees bent, feet flat, squeeze your glutes to lift your hips — 15–20 reps, 2–3 rounds. Clamshells: lie on your side, knees bent, feet together, open your top knee like a clamshell — 15 each side, 2–3 rounds. Weak hips are behind a lot of common runner aches, so this pays off." },
  { keywords: ["balance", "single leg", "stability", "ankle stability"],
    answer: "Single-leg balance: stand on one foot 30 seconds each side — close your eyes once that's easy. Single-leg reach: balance on one leg, hinge forward and reach your hand toward the floor, then stand back up — 8–10 each side. Running is just a series of single-leg landings, so this protects your knees and ankles." },
  { keywords: ["warm up", "warmup", "warm-up", "before practice", "before a workout"],
    answer: "Skip static stretching cold — it doesn't warm anything up and can even sap a little power. Better: an easy 5-10 minute jog, then dynamic drills like leg swings, high knees, butt kicks, and walking lunges, then 2-4 short strides (quick 20-second accelerations) to wake your legs up before the real work starts." },
  { keywords: ["cool down", "cooldown", "cool-down", "after a workout", "after practice"],
    answer: "An easy jog or walk for 5-10 minutes right after a hard effort helps bring your heart rate down gradually instead of stopping cold. That's also the best time for static stretching — your muscles are warm, so it's safer and more effective than stretching before you run." },

  // ----- recovery -----
  { keywords: ["foam roll", "foam rolling", "ice or heat", "ice bath", "heating pad"],
    answer: "Foam roll calves, quads, and hamstrings for 30–60 seconds each, rolling slowly and pausing briefly on tender spots — skip rolling directly on joints or bone. Ice is best for fresh soreness or swelling in the first day or two. Heat is better for loosening a muscle that's just tight, or before stretching." },
  { keywords: ["sleep", "rest day", "how much sleep", "recovery day", "off day"],
    answer: "This one's underrated: teen athletes genuinely need more sleep than adults — aim for 8–10 hours. Your body adapts and repairs itself during sleep and rest days, not during the workout itself. Skipping rest days doesn't make you tougher, it just raises injury risk — an easy walk or light spin is a fine way to stay active on an off day without adding stress." },

  // ----- nutrition -----
  { keywords: ["eat before", "before a run", "before a race", "pre race meal", "before racing"],
    answer: "1–3 hours before running, go for easy-to-digest carbs — a banana, toast with honey, oatmeal. Heavy, greasy, or high-fiber food right before a hard effort can sit poorly and cause stomach trouble mid-run, so save those for other times of day." },
  { keywords: ["eat after", "after a run", "after a race", "recovery meal", "post run"],
    answer: "Try to eat within 30–60 minutes of finishing — carbs plus some protein refill your energy stores and kickstart muscle repair. Chocolate milk is a genuinely well-studied classic for this, or a sandwich, or yogurt with fruit." },
  { keywords: ["what should i eat", "diet", "everyday nutrition", "meal plan", "eating enough", "nutrition"],
    answer: "Distance runners need real fuel — under-eating hurts performance and recovery more than almost anything else. Build meals around whole grains, fruits, and vegetables for steady energy, protein at each meal for repair, and don't be afraid of carbs — they're your main fuel source, not something to avoid." },
  { keywords: ["water", "hydration", "hydrate", "how much water", "drink"],
    answer: "Drink water throughout the whole day, not just right before you run. On hot days or longer runs, add electrolytes too. A simple check: pale yellow is well-hydrated; if it's dark, drink more." },

  // ----- common injuries -----
  { keywords: ["shin splint", "shin splints", "shin pain", "shin hurt", "shins hurt"],
    answer: "Shin splints usually come from a jump in mileage or intensity. Back off your volume for a bit, ice the area, and stretch your calves regularly. Check your shoes aren't worn out too. If the pain is sharp and stays in one exact spot rather than a general ache along the bone, stop running and get it checked out — that pattern can mean something more serious than shin splints." },
  { keywords: ["runner's knee", "runners knee", "knee pain", "knee hurt", "knee hurts", "patellofemoral"],
    answer: "Knee pain in runners is very often about weak hips and glutes, not the knee itself — ask me about glute strength. In the meantime, ice it, cut back on hills and mileage for a few days, and foam roll your quads and IT band. See a doctor or athletic trainer if it swells, catches, or feels unstable." },
  { keywords: ["plantar fasciitis", "heel pain", "arch pain", "bottom of my foot", "heel hurts"],
    answer: "Classic sign is pain in the heel or arch that's worst with your first steps in the morning. Rolling your foot slowly over a frozen water bottle or a lacrosse ball helps, along with calf and foot stretches. Give it real rest if it's sharp, and see a doctor or podiatrist if it doesn't ease up after a week or two of managing it." },
  { keywords: ["achilles", "back of my ankle", "achilles tendon", "achilles pain"],
    answer: "Achilles pain or stiffness responds well to calf stretches and slow heel-drop exercises (stand on a step, lower your heel below the edge slowly — that's an eccentric heel drop). Ease off hill work while it heals and ice it after running. A sudden, sharp pain like you got kicked in the back of the ankle needs a doctor right away — that can mean a tear, not just tendinitis." },
  { keywords: ["blister", "blisters", "foot rubbing", "hot spot on my foot"],
    answer: "Prevent them with well-fitted shoes and moisture-wicking socks instead of cotton — a small anti-blister balm or tape on spots that always rub helps too. If one forms, keep it clean and covered with a bandage or blister pad rather than popping it. If it's big and painful, ask a parent or your athletic trainer to help drain it safely rather than doing it yourself." },
  { keywords: ["side stitch", "side cramp", "cramp in my side", "stitch", "side pain while running"],
    answer: "Side stitches usually come from shallow breathing out of rhythm with your stride, or eating too close to running. In the moment: slow down, take slow deep belly breaths, and try pressing on the spot with your hand. To prevent them, avoid a big meal within about 2 hours of running and ease into your pace instead of starting fast." },
  { keywords: ["ankle", "rolled my ankle", "twisted my ankle", "ankle sprain", "sprained ankle"],
    answer: "A rolled or sprained ankle needs RICE right away: Rest, Ice (20 minutes on, 20 off), Compression (a wrap, snug but not tight), Elevation (prop it above your heart). If you can't put weight on it at all, or it's badly swollen or bruised, get it checked by a doctor — that can mean a more serious sprain or even a fracture. For a mild one, once swelling's down, gentle ankle circles and alphabet-tracing with your foot rebuild mobility before easing back into running." },
  { keywords: ["hip pain", "hip hurts", "hip joint", "bursitis", "outer hip"],
    answer: "Hip pain in runners is often from the muscles around the joint rather than the joint itself — tight hip flexors, weak glutes, or IT band tightness are common culprits (ask me about those). A dull ache that improves with easy movement usually responds to stretching and glute strength work. Sharp pain deep in the joint, pain that changes how you walk, or pain that doesn't ease with rest is worth getting checked by a doctor or athletic trainer." },
  { keywords: ["joint pain", "joints hurt", "stress fracture", "bone pain"],
    answer: "General joint aches after a hard week of training are common and usually settle with a bit of extra rest and the recovery basics (ask me about recovery). But pain that's sharp, focused on one small spot on a bone, gets worse the more you run, and doesn't ease with rest is different — that pattern can mean a stress fracture, which needs an X-ray or scan to diagnose properly and real time off to heal. Don't try to run through that one; tell your coach and see a doctor." },
    { keywords: ["pulled a muscle", "muscle strain", "pulled hamstring", "pulled calf", "pulled quad", "strain"],
    answer: "A real strain or pull (not just tightness) usually comes with a sudden, sharp twinge during the run, not a gradual ache. RICE it right away (Rest, Ice, Compression, Elevation), and give it real rest — running through a strain often turns a one-week injury into a month-long one. Gentle stretching only once the sharp pain has eased, and see a doctor or athletic trainer if it's severe, bruises, or doesn't improve after a few days." },
  { keywords: ["groin", "groin pain", "groin strain", "groin pull", "inner thigh"],
    answer: "Groin strains usually come from a sudden movement like a fast start or quick direction change, and feel like a sharp pull on the inside of your thigh near the hip. RICE it right away (Rest, Ice, Compression, Elevation) and avoid stretching it further while it's acute — that can make a strain worse. Give it real time off from running; pushing through a groin strain often turns a short injury into a long one. See a doctor or athletic trainer if it's severe, bruises, or isn't improving after several days of rest." },


  // ----- race day & mental -----
  { keywords: ["nervous", "anxiety", "scared", "race anxiety", "meet nerves", "worried about a race"],
    answer: "Being nervous before a race is completely normal — it usually means you care, not that something's wrong. A few things that genuinely help: a consistent pre-race routine so your body knows what's coming, slow deep breaths to calm your nervous system (ask me about breathing exercises), and focusing on your own effort and process instead of the outcome or other runners. One rough night of sleep before a big race is common and usually doesn't ruin performance, so don't stress about the stress." },
  { keywords: ["hot weather", "heat", "overheating", "running in the heat", "hot outside"],
    answer: "Watch for dizziness, nausea, headache, or suddenly stopping sweating — those are signs of heat illness, and if they happen you should stop, get shade, cool down, and tell an adult right away. To prevent it: hydrate well in the hours before, not just during, wear light and breathable clothing, and be realistic that pace naturally slows on hot, humid days — that's normal, not a sign you're out of shape." },

  // ----- breathing -----
  { keywords: ["breathing exercise", "how to breathe", "calm down breathing", "deep breathing", "belly breathing", "breathing exercises"],
    answer: "Box breathing works well before a race or when you're stressed: breathe in for 4 seconds, hold for 4, breathe out for 4, hold for 4, repeat. For belly breathing: put a hand on your stomach, breathe in through your nose so your stomach rises (not your chest), breathe out slowly through your mouth. Both slow your heart rate and calm your nervous system — genuinely useful the night before a big meet, not just a gimmick." },
  { keywords: ["breathing while running", "breathing pattern", "how to breathe when running", "running breathing technique"],
    answer: "A common pattern is 3:2 — inhale for 3 footstrikes, exhale for 2 — for easy-to-moderate paces, switching to 2:1 for harder efforts like races. The idea is alternating which foot lands when you exhale (your body's most vulnerable moment), which some research ties to lower injury risk. It takes practice to feel natural, so try it on easy runs first, not on race day." },

  // ----- general fallback -----
  { keywords: ["hurts", "pain", "injury", "injured", "something hurts"],
    answer: "Normal soreness after a hard effort is dull, shows up on both sides, peaks a day or two later, and eases up once you're warmed up — rest, easy movement, and ice usually sort that out.\n\nSharp pain, pain only on one side, pain that gets worse as you run, swelling, or anything sticking around more than a few days is different — that's a sign to back off, tell your coach, and see an athletic trainer or doctor. Tell me what specifically hurts (like 'my ankle' or 'my hip') and I can give more specific pointers, but I'm not a substitute for someone who can actually examine it." }
];

/* =========================================
   CONVERSATIONAL FALLBACK
   Catches "my ___ hurts/is tight" style
   phrasing even when it doesn't match one of
   the exact keyword phrases above.
   ========================================= */
const BODY_PARTS = {
  knee: "knee", knees: "knee", ankle: "ankle", ankles: "ankle",
  hip: "hip", hips: "hip", shin: "shin", shins: "shin",
  calf: "calf", calves: "calf", hamstring: "hamstring", hamstrings: "hamstring",
  quad: "quad", quads: "quad", quadricep: "quad", quadriceps: "quad",
  heel: "heel", heels: "heel", foot: "foot", feet: "foot", back: "back",
  achilles: "achilles", thigh: "thigh", thighs: "thigh", groin: "groin",
  shoulder: "shoulder", shoulders: "shoulder", elbow: "elbow",
  wrist: "wrist", neck: "neck", toe: "toe", toes: "toe", arm: "arm", chest: "chest"
};

const TIGHTNESS_WORDS = ["tight", "tightness", "stiff", "stiffness"];
const INJURY_WORDS = ["hurt", "hurts", "hurting", "pain", "painful", "sore", "soreness",
  "ache", "aches", "aching", "sprain", "sprained", "twist", "twisted", "pulled",
  "strain", "strained", "swollen", "swelling", "cramp", "cramping", "throbbing", "burning", "tender"];

const TIGHTNESS_TOPIC = { calf: "calf stretch", hamstring: "tight hamstring", quad: "hip tight", hip: "hip tight", ankle: "stiff ankle" };
const INJURY_TOPIC = {
  knee: "knee pain", ankle: "ankle sprain", hip: "hip pain", shin: "shin splint",
  achilles: "achilles pain", heel: "heel pain", back: "back pain", groin: "groin pain",
  foot: "heel pain", calf: "pulled calf", hamstring: "pulled hamstring", quad: "pulled quad"
};

function tokenize(text) {
  return text.toLowerCase().match(/[a-z']+/g) || [];
}

function findTopicByExactKeyword(phrase) {
  return TOPICS.find(t => t.keywords.includes(phrase));
}

function findBodyPartMatch(userText) {
  const words = tokenize(userText);
  const foundPart = words.map(w => BODY_PARTS[w]).find(Boolean);
  if (!foundPart) return null;

  const isInjury = words.some(w => INJURY_WORDS.includes(w));
  const isTight = words.some(w => TIGHTNESS_WORDS.includes(w));
  if (!isInjury && !isTight) return null;

  const searchPhrase = isInjury
    ? (INJURY_TOPIC[foundPart] || TIGHTNESS_TOPIC[foundPart])
    : (TIGHTNESS_TOPIC[foundPart] || INJURY_TOPIC[foundPart]);

  if (searchPhrase) {
    const topic = findTopicByExactKeyword(searchPhrase);
    if (topic) return topic;
  }

  return {
    answer: `I don't have specific ${foundPart} content built in yet, but the general rule still applies: dull, two-sided soreness that fades in a day or two is normal — rest, ice, and easy movement. Sharp pain, one-sided pain, swelling, or anything that doesn't ease up after a few days needs your coach and a doctor or athletic trainer, not just me. I do know these well: shin, calf, hamstring, quad, knee, ankle, hip, heel, groin, back, or Achilles.`
  };
}


const STARTER_CHIPS = [
  "My shins hurt",
  "What should I eat before a race?",
  "I'm nervous for my meet",
  "How should I breathe when running?"
];


/* =========================================
   MATCHING — scores every topic by how many
   of its keywords appear in what you typed;
   longer/more specific phrases score higher.
   ========================================= */

function findPhraseMatch(userText) {
  const text = userText.toLowerCase();
  let best = null;
  let bestScore = 0;

  TOPICS.forEach(topic => {
    let score = 0;
    topic.keywords.forEach(kw => {
      if (text.includes(kw)) score += kw.split(" ").length;
    });
    if (score > bestScore) {
      bestScore = score;
      best = topic;
    }
  });

  return { topic: best, score: bestScore };
}

function findBestMatch(userText) {
  const phraseMatch = findPhraseMatch(userText);
  if (phraseMatch.score >= 2) return phraseMatch.topic;

  const bodyMatch = findBodyPartMatch(userText);
  if (bodyMatch) return bodyMatch;

  return phraseMatch.topic;
}


/* =========================================
   CHAT ENGINE
   ========================================= */
const log = document.getElementById("chat-log");
const input = document.getElementById("chat-input");

function addBubble(from, text) {
  const b = document.createElement("div");
  b.className = "bubble " + from;
  b.textContent = text;
  log.appendChild(b);
  log.scrollTop = log.scrollHeight;
  return b;
}

function showChips() {
  const row = document.createElement("div");
  row.className = "chip-row";
  STARTER_CHIPS.forEach(text => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = text;
    chip.addEventListener("click", () => { row.remove(); sendMessage(text); });
    row.appendChild(chip);
  });
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function sendMessage(text) {
  text = text.trim();
  if (!text) return;
  addBubble("user", text);
  input.value = "";

  const typingBubble = addBubble("bot", "···");
  typingBubble.classList.add("typing");

  setTimeout(() => {
    typingBubble.remove();
    const match = findBestMatch(text);
    addBubble("bot", match
      ? match.answer
      : "I didn't quite catch that — try rewording it, or ask about stretches, strength, recovery, nutrition, a specific ache, or race nerves.");
  }, 500);
}

document.getElementById("chat-send").addEventListener("click", () => sendMessage(input.value));
input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(input.value); });

addBubble("bot", "Hey, I'm Health Bot 🏥 — ask me anything about stretches, strength, recovery, nutrition, common injuries, or race-day nerves. Try one of these, or type your own:");
showChips();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
