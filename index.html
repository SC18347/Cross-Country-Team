<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Workouts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

.nav-menu { position: fixed; top: 16px; left: 16px; z-index: 210; }
.nav-toggle {
  padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--panel-border);
  color: var(--cyan); border-radius: 999px;
  font-size: 1.1rem; line-height: 1; cursor: pointer;
}
.nav-dropdown {
  display: none;
  position: absolute; top: calc(100% + 8px); left: 0;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 14px; padding: 8px; min-width: 170px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.nav-dropdown.open { display: flex; flex-direction: column; gap: 2px; }
.nav-dropdown a {
  display: block; padding: 10px 12px; border-radius: 8px;
  color: var(--text); text-decoration: none;
  font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 0.95rem;
}
.nav-dropdown a:active { background: var(--cyan-soft); }


:root {
  --bg: #060a10;
  --grid-line: rgba(61, 220, 255, 0.05);
  --panel: #0c141d;
  --panel-border: rgba(61, 220, 255, 0.28);
  --cyan: #3ddcff;
  --cyan-soft: rgba(61, 220, 255, 0.15);
  --amber: #ffb454;
  --amber-soft: rgba(255, 180, 84, 0.12);
  --text: #d7eef5;
  --muted: #6f93a3;
  --radius: 14px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 34px 34px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.page-header { text-align: center; padding: 44px 20px 20px; }
.status-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.12em;
  color: var(--cyan);
  border: 1px solid var(--panel-border);
  padding: 5px 14px; border-radius: 999px;
  background: var(--cyan-soft);
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }
.page-header h1 {
  margin: 16px 0 6px;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700; font-size: 1.5rem; letter-spacing: 0.05em;
  color: var(--text);
  text-shadow: 0 0 18px var(--cyan-soft);
}
.hud-sub {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em;
}

/* ===== DAY CARDS ===== */
.day-cards {
  max-width: 460px; margin: 0 auto; padding: 24px 16px 8px;
  display: flex; flex-direction: column; gap: 16px;
}
.day-card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.day-card::before, .day-card::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border: 2px solid var(--cyan); opacity: 0.55;
}
.day-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.day-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.day-card.is-today {
  border-color: var(--amber);
  background: linear-gradient(var(--amber-soft), var(--amber-soft)), var(--panel);
  box-shadow: 0 0 24px rgba(255, 180, 84, 0.18);
}
.day-card.is-today::before, .day-card.is-today::after { border-color: var(--amber); opacity: 0.9; }
.day-card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.day-name-wrap { display: flex; align-items: center; gap: 8px; }
.day-name {
  font-family: 'Orbitron', sans-serif; font-weight: 600;
  font-size: 1rem; letter-spacing: 0.03em; color: var(--cyan);
}
.day-card.is-today .day-name { color: var(--amber); }
.today-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.08em;
  color: #0a0e14; background: var(--amber);
  padding: 2px 8px; border-radius: 4px;
}
.day-date { font-family: 'Share Tech Mono', monospace; color: var(--muted); font-size: 0.82rem; }
.practice-time {
  margin-top: 10px; font-family: 'Share Tech Mono', monospace;
  font-size: 0.88rem; color: var(--cyan);
}
.day-card.is-today .practice-time { color: var(--amber); }
.workout-text { margin-top: 8px; line-height: 1.45; white-space: pre-line; font-size: 1.02rem; }

/* ===== FULL WEEK BUBBLE ===== */
.week-bubble {
  position: relative; max-width: 460px; margin: 12px auto 20px; padding: 20px;
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px;
}
.week-bubble::before, .week-bubble::after {
  content: ""; position: absolute; width: 18px; height: 18px;
  border: 2px solid var(--cyan); opacity: 0.55;
}
.week-bubble::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.week-bubble::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.week-bubble h2 {
  margin: 0 0 14px; text-align: center;
  font-family: 'Orbitron', sans-serif; font-weight: 600;
  font-size: 0.9rem; letter-spacing: 0.06em; color: var(--cyan);
}
.week-bubble img { width: 100%; display: block; border-radius: 10px; }

/* ===== FOOTER ===== */
.site-footer {
  text-align: center; padding: 18px 20px 34px;
  color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 0.75rem;
}
.site-footer a { color: var(--muted); text-decoration: none; opacity: 0.6; }
.site-footer a:hover { opacity: 1; color: var(--cyan); }

.health-bot-btn {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  right: 20px; z-index: 50;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--amber);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; text-decoration: none;
  box-shadow: 0 4px 18px rgba(255, 180, 84, 0.5);
}
.health-bot-btn:active { transform: scale(0.94); }


</style>

<link rel="manifest" href="manifest.json">

</head>
<body>

<div class="nav-menu">
  <button id="nav-toggle" class="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
  <div id="nav-dropdown" class="nav-dropdown">
    <a href="index.html">🏠 Schedule</a>
    <a href="health-bot.html">🤖 Health Bot</a>

  </div>
</div>


<a href="health-bot.html" class="health-bot-btn" aria-label="Health Bot">🤖</a>



  <header class="page-header">
    <div class="status-tag"><span class="status-dot"></span>SYSTEM ONLINE</div>
    <h1>WEEKLY WORKOUTS</h1>
    <div class="hud-sub" id="hud-date"></div>
  </header>

  <main>
    <section id="day-cards" class="day-cards" aria-live="polite"></section>

    <section class="week-bubble">
      <h2>FULL MEET SCHEDULE</h2>
      <img src="IMG_6052.jpeg" alt="Photo of this week's full workout schedule" id="week-photo">
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> SC Smith · <a href="editor.html">edit</a></p>
  </footer>

<script>

(function () {
  const toggle = document.getElementById("nav-toggle");
  const dropdown = document.getElementById("nav-dropdown");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = dropdown.classList.toggle("open");
    toggle.textContent = isOpen ? "✕" : "☰";
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target) && e.target !== toggle) {
      dropdown.classList.remove("open");
      toggle.textContent = "☰";
      toggle.setAttribute("aria-expanded", "false");
    }
  });
})();


if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");


/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   WORKOUT DATA blah blah — search "workout" to jump here
   Replace everything below, down through the
   closing "];", with what editor.html generates.
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */

const workouts = [
  { date: "2026-09-14", time: "6:30AM", workout: "Sprint workout (AMS Stadium)" },
  { date: "2026-09-15", time: "6:30AM", workout: "Long run (Practice Fields)" },
  { date: "2026-09-16", time: "4:10PM", workout: "Meet day (Summit High School)" },
  { date: "2026-09-17", time: "7:00AM", workout: "Cool down run (Practice Fields)" },
  { date: "2026-09-18", time: "6:30AM", workout: "Long run (Disc Golf Course)" },
];


/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   END WORKOUT DATA
   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */


function renderCards() {
  const container = document.getElementById("day-cards");
  container.innerHTML = "";
  const today = new Date();

  workouts.forEach(w => {
    const d = new Date(w.date + "T00:00:00");
    const dayName = d.toLocaleDateString("en-US", { weekday: "long" });
    const dateLabel = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const isToday = d.toDateString() === today.toDateString();

    const card = document.createElement("div");
    card.className = "day-card" + (isToday ? " is-today" : "");
    if (isToday) card.id = "today-card";

    card.innerHTML = `
      <div class="day-card-top">
        <span class="day-name-wrap">
          <span class="day-name">${dayName}</span>
          ${isToday ? '<span class="today-tag">TODAY</span>' : ""}
        </span>
        <span class="day-date">${dateLabel}</span>
      </div>
      <div class="practice-time">PRACTICE: ${w.time}</div>
      <div class="workout-text">${w.workout || "Rest day"}</div>
    `;
    container.appendChild(card);
  });

  const todayCard = document.getElementById("today-card");
  if (todayCard) {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    todayCard.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
  }
}
renderCards();

document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("hud-date").textContent =
  "TRACKING — " + new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }).toUpperCase();
</script>
</body>
